name: Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
      YOUTUBE_API_KEYS_PLUS: ${{ secrets.YOUTUBE_API_KEYS_PLUS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
      FALLBACK_LLM_KEYS: ${{ secrets.FALLBACK_LLM_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      QF_QUOTA_FILE: state/quota.json
      GUARDIAN_API_KEYS: ${{ secrets.GUARDIAN_API_KEYS }}
      NYT_API_KEYS: ${{ secrets.NYT_API_KEYS }}
      YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
      FALLBACK_LLM_PROVIDER: ${{ vars.FALLBACK_LLM_PROVIDER }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          bash scripts/install_deps.sh requirements.txt   # borné dans le temps ; yt-dlp toujours à jour
      - run: |
          mkdir -p state
          { echo "# Dernier diagnostic"; echo; echo '```'; python -m quote_finder.check 2>&1 | grep -v "^ *$"; echo '```'; } > /tmp/diag.md
          cat /tmp/diag.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer l'état des clés (state/QUOTAS.md)
        if: always()
        run: |
          python -m quote_finder.quota merge state/quota.json > /dev/null
          python -m quote_finder.status > /dev/null && cat ETAT.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/quota.json /tmp/quota_diag.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m quote_finder.quota merge state/quota.json /tmp/quota_diag.json > /dev/null
            python -m quote_finder.status > /dev/null
            cp /tmp/diag.md state/DIAGNOSTIC.md   # compte rendu lisible dans le dépôt
            git add state ETAT.md
            git diff --cached --quiet && exit 0
            git commit -q -m "état des clés API"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
