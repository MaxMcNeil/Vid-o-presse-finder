name: Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FALLBACK_LLM_KEYS: ${{ secrets.FALLBACK_LLM_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      QF_QUOTA_FILE: state/quota.json
      GUARDIAN_API_KEYS: ${{ secrets.GUARDIAN_API_KEYS }}
      NYT_API_KEYS: ${{ secrets.NYT_API_KEYS }}
      YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
      FALLBACK_LLM_PROVIDER: ${{ vars.FALLBACK_LLM_PROVIDER }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r requirements.txt && pip install -U -q yt-dlp   # yt-dlp toujours à jour (YouTube change souvent)
      - run: python -m quote_finder.check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer l'état des clés (state/QUOTAS.md)
        if: always()
        run: |
          python -m quote_finder.quota merge state/quota.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "état des clés API"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
