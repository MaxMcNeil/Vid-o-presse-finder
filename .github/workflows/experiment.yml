name: Experiment precision

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt faster-whisper && pip install -U -q yt-dlp
      - run: python scripts/experiment_precision.py
      - if: always()
        run: |
          git config user.name "quote-finder-bot"; git config user.email "actions@users.noreply.github.com"
          git add state/experiment.json && git commit -q -m "expérience précision" && \
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
